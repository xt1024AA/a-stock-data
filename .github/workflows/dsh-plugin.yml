name: dsh-plugin

# 守护 DSH 插件这一侧的三件事：
#   1. 生成物与 SKILL.md 同步（有人改了 SKILL.md 却没重新生成，这里会红）
#   2. 随包 SKILL.md 仍满足 DSH 的 skill 发现契约（frontmatter / 发现深度）
#   3. 工具面装配正确（用假 ctx 复刻 Cordis 的 effect / register 语义）
#
# 默认不跑联网用例：CI 不该变成一个爬虫，端点可用性受数据源侧波动影响。
# 需要联网验证时本地跑 `node scripts/test-tools.mjs --live`。

on:
  push:
    branches: ['a-stock-data-DSH', main]
    paths:
      - 'SKILL.md'
      - 'skills/**'
      - 'lib/**'
      - 'scripts/**'
      - 'package.json'
      - 'cordis.patch.yml'
  pull_request:
    paths:
      - 'SKILL.md'
      - 'skills/**'
      - 'lib/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  plugin:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装运行时依赖
        run: |
          python -m pip install --upgrade pip
          # mootdx 刻意不装：它要求 httpx<0.26，与宿主 litellm/mcp 所需的 httpx>=0.27 冲突
          pip install requests pandas numpy pyyaml

      - name: 生成物与 SKILL.md 同步
        run: python scripts/build_runtime.py --check

      - name: 随包 SKILL.md 满足 DSH 发现契约
        run: python scripts/check_skill_contract.py

      - name: 工具面自测（不含联网）
        run: node scripts/test-tools.mjs